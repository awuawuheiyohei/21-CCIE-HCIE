! R2 - AS 65010 ASBR
! 同时有 iBGP (R1, loopback) 和 eBGP (R3)

sysname R2

interface GigabitEthernet0/0/0
 ip address 10.0.12.2 255.255.255.252

interface GigabitEthernet0/0/1
 ip address 10.0.23.2 255.255.255.252

interface LoopBack0
 ip address 2.2.2.2 255.255.255.255

! 用 ACL + route-policy 演示 LocalPref / MED
acl number 2000
 rule 5 permit source 10.2.0.0 0.0.255.255

route-policy SET_LP_IN permit node 10
 if-match acl 2000
 apply local-preference 200

route-policy SET_MED_OUT permit node 10
 if-match acl 2000
 apply cost 50

! BGP
bgp 65010
 router-id 2.2.2.2
 peer 1.1.1.1 as-number 65010
 peer 1.1.1.1 connect-interface LoopBack0
 peer 10.0.23.3 as-number 65020
 #
 ipv4-family unicast
  network 10.2.0.0 255.255.0.0
  peer 1.1.1.1 enable
  peer 1.1.1.1 next-hop-local
  peer 1.1.1.1 route-policy SET_LP_IN import
  peer 10.0.23.3 enable
  peer 10.0.23.3 route-policy SET_MED_OUT export

return
