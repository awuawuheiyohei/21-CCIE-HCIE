! R3 - AS 65020 ASBR
! 同时有 eBGP (R2) 和 iBGP (R4)

sysname R3

interface GigabitEthernet0/0/0
 ip address 10.0.23.3 255.255.255.252

interface GigabitEthernet0/0/1
 ip address 10.0.34.3 255.255.255.252

interface LoopBack0
 ip address 3.3.3.3 255.255.255.255

bgp 65020
 router-id 3.3.3.3
 peer 10.0.23.2 as-number 65010
 peer 4.4.4.4 as-number 65020
 peer 4.4.4.4 connect-interface LoopBack0
 #
 ipv4-family unicast
  network 10.3.0.0 255.255.0.0
  peer 10.0.23.2 enable
  peer 4.4.4.4 enable
  peer 4.4.4.4 next-hop-local

return
