name: ccie-hcie-bgp-multi-as

# 拓扑：4 节点 2 个 AS，eBGP + iBGP
#
#   AS 65010                              AS 65020
#   +-------+        iBGP       +-------+        eBGP       +-------+        iBGP       +-------+
#   |  R1   |-------------------|  R2   |--------------------|  R3   |-------------------|  R4   |
#   |       |    10.0.12.0/30   |       |    10.0.23.0/30    |       |    10.0.34.0/30   |       |
#   +-------+   (loopback)      +-------+                    +-------+   (loopback)     +-------+
#   (通告 10.1.0.0/16)         (ASBR 65010)                (ASBR 65020)               (通告 10.4.0.0/16)

topology:
  nodes:
    R1:
      kind: linux
      image: frrouting/frr:v8.4.1
      labels:
        asn: "65010"
        role: internal
      binds:
        - configs/R1_frr.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/daemons:/etc/frr/daemons
        - configs/R1_setup.sh:/root/setup.sh
      cmd: bash -c "/root/setup.sh && /usr/lib/frr/frrinit.sh start && sleep infinity"

    R2:
      kind: linux
      image: frrouting/frr:v8.4.1
      labels:
        asn: "65010"
        role: asbr
      binds:
        - configs/R2_frr.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/daemons:/etc/frr/daemons
        - configs/R2_setup.sh:/root/setup.sh
      cmd: bash -c "/root/setup.sh && /usr/lib/frr/frrinit.sh start && sleep infinity"

    R3:
      kind: linux
      image: frrouting/frr:v8.4.1
      labels:
        asn: "65020"
        role: asbr
      binds:
        - configs/R3_frr.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/daemons:/etc/frr/daemons
        - configs/R3_setup.sh:/root/setup.sh
      cmd: bash -c "/root/setup.sh && /usr/lib/frr/frrinit.sh start && sleep infinity"

    R4:
      kind: linux
      image: frrouting/frr:v8.4.1
      labels:
        asn: "65020"
        role: internal
      binds:
        - configs/R4_frr.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/daemons:/etc/frr/daemons
        - configs/R4_setup.sh:/root/setup.sh
      cmd: bash -c "/root/setup.sh && /usr/lib/frr/frrinit.sh start && sleep infinity"

  links:
    # R1 - R2 (AS 65010 内部，物理口)
    - endpoints: ["R1:eth1", "R2:eth1"]
    # R2 - R3 (AS 65010 - AS 65020 eBGP)
    - endpoints: ["R2:eth2", "R3:eth1"]
    # R3 - R4 (AS 65020 内部，物理口)
    - endpoints: ["R3:eth2", "R4:eth1"]

