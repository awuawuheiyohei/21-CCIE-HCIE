! R2 - AS 65010 的 ASBR
! 同时有 iBGP（R1，loopback）和 eBGP（R3）

frr version 8.1
frr defaults traditional
hostname R2
log syslog informational
no ipv6 forwarding

interface eth1
 ip address 10.0.12.2/30

interface eth2
 ip address 10.0.23.1/30

interface lo
 ip address 2.2.2.2/32

! Static routes to loopback peers:
!  - 1.1.1.1 (R1 lo, iBGP) via R1 physical
!  - 4.4.4.4 (R4 lo, AS 65020) via R3 eBGP next-hop — needed for
!    R2 to forward pings to 4.4.4.4 across the AS boundary
ip route 1.1.1.1/32 10.0.12.1
ip route 4.4.4.4/32 10.0.23.2

! Blackhole route for our advertised prefix — see R1_frr.conf comment
ip route 10.2.0.0/16 Null0

! R2 是 ASBR：iBGP 同 AS 内部 + eBGP 跨 AS
router bgp 65010
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 1.1.1.1 remote-as 65010
 neighbor 1.1.1.1 update-source lo
 neighbor 10.0.23.2 remote-as 65020
 !
 address-family ipv4 unicast
  network 10.2.0.0/16
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 next-hop-self
  neighbor 1.1.1.1 route-map SET_LP_IN in
  neighbor 1.1.1.1 route-map SET_LP_OUT out
  neighbor 10.0.23.2 activate
  neighbor 10.0.23.2 route-map SET_MED out

! 用 route-map 演示路径属性操纵
route-map SET_LP_IN permit 10
 set local-preference 200

route-map SET_LP_OUT permit 10
 set local-preference 200

route-map SET_MED permit 10
 set metric 50

line vty
!

end
