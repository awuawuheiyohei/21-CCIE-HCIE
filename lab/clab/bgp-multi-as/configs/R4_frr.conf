! R4 - AS 65020 内部路由器

frr version 8.1
frr defaults traditional
hostname R4
log syslog informational
no ipv6 forwarding

interface eth1
 ip address 10.0.34.4/30

interface lo
 ip address 4.4.4.4/32

! Static route to iBGP peer (R3) loopback. Same arp_ignore logic
! as R3: R4 must ARP 10.0.34.3 (R3's eth2 IP, in R3's /30 subnet
! but technically outside R4's /30) first, then R3 forwards to 3.3.3.3.
ip route 10.0.34.3/32 eth1
ip route 3.3.3.3/32 10.0.34.3

! Blackhole route for our advertised prefix — see R1_frr.conf comment
ip route 10.4.0.0/16 Null0

! iBGP 邻居 (R3) - 用 loopback 建邻居
router bgp 65020
 bgp router-id 4.4.4.4
 neighbor 3.3.3.3 remote-as 65020
 neighbor 3.3.3.3 update-source lo
 !
 address-family ipv4 unicast
  network 10.4.0.0/16
  neighbor 3.3.3.3 activate
  neighbor 3.3.3.3 next-hop-self

line vty
!

end
