! R1 - AS 65010 内部路由器
! 跟 BGP 知识库 (knowledge/01-routing/bgp.md) 是同一逻辑

frr version 8.1
frr defaults traditional
hostname R1
log syslog informational
no ipv6 forwarding

interface eth1
 ip address 10.0.12.1/30

interface lo
 ip address 1.1.1.1/32

! Static route to iBGP peer (R2) loopback — needed because zebra
! owns the kernel routing table, kernel 'ip route' gets cleared
! by zebra on startup, and iBGP-over-loopback needs the route
! BEFORE zebra can serve it.
ip route 2.2.2.2/32 10.0.12.2

! Blackhole route for our advertised prefix — frr 'network' command
! requires an exact-match route in RIB. Without this, frr marks
! 10.1.0.0/16 as '0.0.0.0 inaccessible' and won't advertise it.
ip route 10.1.0.0/16 Null0

! iBGP 邻居 (R2) - 用 loopback 建邻居
router bgp 65010
 bgp router-id 1.1.1.1
 neighbor 2.2.2.2 remote-as 65010
 neighbor 2.2.2.2 update-source lo
 !
 address-family ipv4 unicast
  network 10.1.0.0/16
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 next-hop-self

line vty
!

end
