! R3 - AS 65020 的 ASBR
! 同时有 eBGP（R2）和 iBGP（R4）

frr version 8.1
frr defaults traditional
hostname R3
log syslog informational
no ipv6 forwarding

interface eth1
 ip address 10.0.23.3/30

interface eth2
 ip address 10.0.34.3/30

interface lo
 ip address 3.3.3.3/32

! R3 是 AS 65020 的 ASBR
router bgp 65020
 bgp router-id 3.3.3.3
 neighbor 10.0.23.2 remote-as 65010
 neighbor 4.4.4.4 remote-as 65020
 neighbor 4.4.4.4 update-source lo
 !
 address-family ipv4 unicast
  network 10.3.0.0/16
  neighbor 10.0.23.2 activate
  neighbor 4.4.4.4 activate
  neighbor 4.4.4.4 next-hop-self

line vty
!

end
