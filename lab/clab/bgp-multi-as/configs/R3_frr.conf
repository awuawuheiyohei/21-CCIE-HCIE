! R3 - AS 65020 的 ASBR
! 同时有 eBGP（R2）和 iBGP（R4）

frr version 8.1
frr defaults traditional
hostname R3
log syslog informational
no ipv6 forwarding

interface eth1
 ip address 10.0.23.2/30

interface eth2
 ip address 10.0.34.3/30

interface lo
 ip address 3.3.3.3/32

! Static route to iBGP peer (R4) loopback.
! Note: 10.0.34.4 is R4's physical IP, which is technically outside
! R3's /30 subnet (10.0.34.0/30 = 10.0.34.0-3), but Linux on R3
! can ARP 10.0.34.4 over the veth pair. R4 kernel will reply to
! ARP for 10.0.34.4 (its own eth1 IP) but NOT for 4.4.4.4 (its lo IP,
! due to default arp_ignore=1). So R3 must ARP 10.0.34.4 first.
ip route 10.0.34.4/32 eth2
ip route 4.4.4.4/32 10.0.34.4

! Blackhole route for our advertised prefix — see R1_frr.conf comment
ip route 10.3.0.0/16 Null0

! R3 是 AS 65020 的 ASBR
router bgp 65020
 bgp router-id 3.3.3.3
 neighbor 10.0.23.1 remote-as 65010
 neighbor 4.4.4.4 remote-as 65020
 neighbor 4.4.4.4 update-source lo
 !
 address-family ipv4 unicast
  network 10.3.0.0/16
  neighbor 10.0.23.2 activate
  neighbor 4.4.4.4 activate
  neighbor 4.4.4.4 next-hop-self

line vty
!

end
