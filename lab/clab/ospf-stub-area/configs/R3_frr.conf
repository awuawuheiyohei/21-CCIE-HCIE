! R3 - Area 1 内部路由器 (stub 区域成员)
!
! 关键配置:
!  - 'area 1 stub' 让 R3 成为 stub area 成员
!    → 不收 Type 5 (external) LSA
!    → 但能收 Type 3 (inter-area summary) LSA — 这是普通 stub
!    → totally stubby (在 ABR 配 no-summary) 时连 Type 3 也不收，只收 0.0.0.0/0
!  - 期待 R3 路由表: connected + 0.0.0.0/0 默认路由 (没有 10.99.0.0/16, 也没有 1.1.1.1)

frr version 8.1
frr defaults traditional
hostname R3
log syslog informational
no ipv6 forwarding

interface eth1
 ip address 10.0.23.2/30
 ip ospf network point-to-point

interface eth2
 ip address 10.0.34.1/30
 ip ospf network point-to-point

interface lo
 ip address 3.3.3.3/32

! OSPF - Area 1 stub
router ospf
 ospf router-id 3.3.3.3
 area 1 stub
 network 10.0.23.0/30 area 1
 network 10.0.34.0/30 area 1
 network 3.3.3.3/32 area 1
!

line vty
!

end
