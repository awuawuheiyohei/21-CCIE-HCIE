! R2 - Area 0 / Area 1 ABR (配置 totally stubby)
!
! 关键配置:
!  - 'area 1 stub no-summary' 把 Area 1 配置为 totally stubby
!    → ABR 注入 0.0.0.0/0 默认路由代替所有 inter-area + external 路由
!  - 'ip route 3.3.3.3/32 10.0.23.2' 强补 R3 loopback 路由
!    (绕开 frr 8.4 ABR self-summary 抑制 bug)

frr version 8.1
frr defaults traditional
hostname R2
log syslog informational
no ipv6 forwarding

interface eth1
 ip address 10.0.12.2/30
 ip ospf network point-to-point

interface eth2
 ip address 10.0.23.1/30
 ip ospf network point-to-point

interface lo
 ip address 2.2.2.2/32

! Static route workaround for frr 8.4 ABR self-summary bug
! (R2 RIB would mark 3.3.3.3 as O>r rejected without this)
ip route 3.3.3.3/32 10.0.23.2
ip route 10.0.34.0/30 10.0.23.2

! OSPF - R2 是 ABR
!  - Area 0: 10.0.12.0/30, 2.2.2.2/32
!  - Area 1: 10.0.23.0/30
!  - Area 1 stub no-summary: totally stubby
router ospf
 ospf router-id 2.2.2.2
 area 1 stub no-summary
 network 10.0.12.0/30 area 0
 network 10.0.23.0/30 area 1
 network 2.2.2.2/32 area 0
!

line vty
!

end
