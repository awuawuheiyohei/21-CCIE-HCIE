! R1 - Area 0 内部路由器 + ASBR (注入 external 路由)
!
! 关键配置:
!  - 'ip route 10.99.0.0/16 Null0' 模拟外部网络存在
!  - 'router ospf / redistribute static' 把这条静态路由注入 OSPF
!    → 成为 Type 5 External LSA
!  - R3 (stub 区域) 应该看不到 10.99.0.0/16 (被 stub 拦截)

frr version 8.1
frr defaults traditional
hostname R1
log syslog informational
no ipv6 forwarding

interface eth1
 ip address 10.0.12.1/30
 ip ospf network point-to-point

interface lo
 ip address 1.1.1.1/32

! 模拟外部网络 (用于 OSPF 注入测试)
ip route 10.99.0.0/16 Null0

! OSPF Area 0
router ospf
 ospf router-id 1.1.1.1
 network 10.0.12.0/30 area 0
 network 1.1.1.1/32 area 0
 redistribute static
!

line vty
!

end
