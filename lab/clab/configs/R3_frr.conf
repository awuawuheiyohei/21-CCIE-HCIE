! R3 - Area 1 内部路由器
! 跟 OSPF lab (HCIE-RS-L-2024-001) 是同一拓扑，方便对照

frr version 8.1
frr defaults traditional
hostname R3
log syslog informational
no ipv6 forwarding

interface R3-eth1
 ip address 10.0.23.3/30
 ip ospf network point-to-point

interface R3-eth2
 ip address 10.0.34.3/30
 ip ospf network point-to-point

interface lo
 ip address 3.3.3.3/32

! OSPF
router ospf
 ospf router-id 3.3.3.3
 network 10.0.23.0/30 area 1
 network 10.0.34.0/30 area 1
 network 3.3.3.3/32 area 1

line vty
!

end
